# Base do Mandaxpress (segura por padrão: nenhuma porta do banco é publicada).
# Sobreposições: docker-compose.dev.yml (desenvolvimento) e
# docker-compose.prod.yml (produção). Selecionadas via COMPOSE_FILE no .env.
name: mandaxpress

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:?defina APP_ENV no .env}
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${MARIADB_DATABASE:?defina MARIADB_DATABASE}
  DB_USER: ${MARIADB_USER:?defina MARIADB_USER}
  DB_PASSWORD: ${MARIADB_PASSWORD:?defina MARIADB_PASSWORD}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?defina ALLOWED_ORIGINS}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?defina MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?}
      MARIADB_USER: ${MARIADB_USER:?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Tarefa única: aplica as migrations pendentes e termina.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: mandaxpress-backend
    command: ["python", "-m", "src.cli", "migrate"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: mandaxpress-backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: mandaxpress-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  caddy_data:
  caddy_config:
